[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-strategy-lab"
version = "0.1.0"
description = "A library of prompt-engineering strategies with a benchmarking harness for local LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thiago Abrante Da Costa" }]
dependencies = [
    "ollama>=0.4.4",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "jupyterlab>=4.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
